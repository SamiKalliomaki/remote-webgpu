[workspace]
resolver = "2"
members = [
    "remote-wgpu-sys",
    "remote-wgpu-runtime",
    "wgpu",
    "winit",
    "bevy_render",
    "bevy_pbr_game",
]

# The vendored bevy_render fork (multi-render-world support on the remote
# backend) replaces the crates.io release for every bevy crate in the tree.
[patch.crates-io]
bevy_render = { path = "bevy_render" }

# Bevy is unusably slow fully unoptimized; keep our own crates fast to
# compile but optimize every dependency.  Use --release for real runs.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
